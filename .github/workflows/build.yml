name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v6
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-sdk-fix-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'main.py') }}
          restore-keys: |
            buildozer-sdk-fix-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            zlib1g:i386 libstdc++6:i386

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Prepare Android SDK licenses and sdkmanager path
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -rn /usr/local/lib/android/sdk/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          if [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" ]; then
            export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH"
            yes | sdkmanager --sdk_root="$HOME/.buildozer/android/platform/android-sdk" "platforms;android-33" "build-tools;33.0.2" || true
          fi

      - name: Build APK with Buildozer
        env:
          BUILDOZER_ALLOW_ROOT: "1"
          ANDROID_SDK_ROOT: "/home/runner/.buildozer/android/platform/android-sdk"
          PATH: "/home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:/home/runner/.buildozer/android/platform/android-sdk/platform-tools:/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/opt/hostedtoolcache/Python/3.11.18/x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: dollarstar-barcode-apk
          path: bin/*.apk
