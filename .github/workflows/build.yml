name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Buildozer & Android SDK/NDK
        uses: actions/cache@v6
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-sdk33-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'main.py') }}
          restore-keys: |
            buildozer-sdk33-v3-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            zlib1g:i386 libstdc++6:i386

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Pre-accept Android SDK licenses
        env:
          BUILDOZER_ALLOW_ROOT: "1"
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          buildozer android update || true
          SDKMANAGER=$(find ~/.buildozer/android/platform/android-sdk -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$HOME/.buildozer/android/platform/android-sdk" --licenses || true
          fi

      - name: Build APK with Buildozer
        env:
          BUILDOZER_ALLOW_ROOT: "1"
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: dollarstar-barcode-apk
          path: bin/*.apk
